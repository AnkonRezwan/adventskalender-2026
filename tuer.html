<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Türchen – Mein Adventskalender | Path of Grace</title>
  <meta name="theme-color" content="#4B3145">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preload" href="assets/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=19">
  <link rel="stylesheet" href="test-gift.css?v=23">
</head>
<body class="simple-page test-page door-page">
  <a class="skip-link" href="#main">Direkt zum Inhalt</a>

  <header class="site-header site-header--simple" id="top">
    <div class="nav-shell">
      <a class="brand" href="index.html" aria-label="Path of Grace – zum Adventskalender">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">
          <span class="brand__name">Path of Grace</span>
          <span class="brand__sub">Adventskalender 2026</span>
        </span>
      </a>
      <a class="button button--primary nav-cta" href="index.html">
        <span>Zum Kalender</span>
      </a>
    </div>
  </header>

  <main id="main" class="test-main">
    <div class="test-head">
      <p class="eyebrow"><span class="eyebrow__dot"></span><span id="doorEyebrowText">Türchen</span></p>
      <h1 id="doorHeading">Dein Türchen</h1>
      <p class="test-head__text" id="doorDate"></p>
    </div>

    <div class="test-stage" id="doorStage">
      <div class="test-halo" aria-hidden="true"></div>

      <!-- Türchen (vor dem Öffnen) -->
      <button class="test-door" id="doorButton" type="button" aria-label="Türchen öffnen">
        <span class="test-door__pattern" aria-hidden="true"></span>
        <span class="test-door__ribbon" aria-hidden="true"></span>
        <span class="test-door__gift" aria-hidden="true">
          <svg viewBox="0 0 120 130" width="120" height="130">
            <rect x="22" y="52" width="76" height="62" rx="8" fill="#f8f3eb" stroke="#d6b46a" stroke-width="1.5"/>
            <rect x="14" y="36" width="92" height="22" rx="6" fill="#e6d6bf" stroke="#d6b46a" stroke-width="1.5"/>
            <rect x="54" y="36" width="12" height="78" fill="#cfa6a0"/>
            <path d="M60 36 C44 18 26 20 26 28 C26 36 46 36 60 36 Z" fill="#cfa6a0"/>
            <path d="M60 36 C76 18 94 20 94 28 C94 36 74 36 60 36 Z" fill="#cfa6a0"/>
            <circle cx="60" cy="36" r="4" fill="#d6b46a"/>
          </svg>
        </span>
        <span class="test-door__top">
          <span class="test-door__num" id="doorNum">01</span>
          <span class="test-door__type" id="doorType">Türchen</span>
        </span>
        <span class="test-door__date" id="doorCardDate"></span>
        <span class="test-door__knob" aria-hidden="true"></span>
        <span class="test-door__hint">Klick zum Öffnen <span aria-hidden="true">→</span></span>
      </button>

      <!-- Lila Umschlag -->
      <div class="test-envelope" id="doorEnvelope" hidden aria-live="polite">
        <div class="test-envelope__body">
          <div class="test-envelope__content" id="doorContent"></div>
        </div>
        <div class="test-envelope__flap" aria-hidden="true"></div>
        <div class="test-envelope__seal" aria-hidden="true">
          <svg viewBox="0 0 40 40" width="40" height="40">
            <circle cx="20" cy="20" r="17" fill="#d6b46a" stroke="#4b3145" stroke-width="2"/>
            <path d="M12 20 L18 26 L29 14" fill="none" stroke="#4b3145" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <div class="test-sparkles" id="doorSparkles" aria-hidden="true"></div>
      <div class="test-confetti" id="doorConfetti" aria-hidden="true"></div>
    </div>

    <div class="door-error" id="doorError" hidden>
      <p>Bitte öffne dein Türchen über den Link in deiner E-Mail.</p>
      <a class="text-link" href="index.html">Zum Adventskalender <span aria-hidden="true">→</span></a>
    </div>
  </main>

  <footer class="site-footer site-footer--simple">
    <div class="footer-shell">
      <div class="footer-bottom">
        <p>© 2026 Gabriele Storz · <a href="index.html">Zum Adventskalender</a></p>
        <nav class="footer-legal" aria-label="Rechtliches">
          <a href="https://gabriele-storz.de/imprint/" target="_blank" rel="noopener">Impressum</a>
          <a href="https://gabriele-storz.de/privacy/" target="_blank" rel="noopener">Datenschutz</a>
          <a href="https://gabriele-storz.de/terms/" target="_blank" rel="noopener">Teilnahmebedingungen</a>
        </nav>
      </div>
    </div>
  </footer>

  <script src="doors.js?v=23"></script>
  <script src="reveal.js?v=23"></script>
  <script src="tuer.js?v=23"></script>
</body>
</html>
